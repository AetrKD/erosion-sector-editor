<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121a21"><meta name="description" content="Erosion Sector 타일과 기믹을 조립하는 스테이지 에디터. Create 설계도를 불러오고 층별로 공간을 구성하세요.">
  <title>Erosion Sector Editor</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./events.css"><link rel="stylesheet" href="./workflow.css"><link rel="stylesheet" href="./event-workshop.css">
<link rel="stylesheet" href="./rework.css"><link rel="stylesheet" href="./workspace-cleanup.css"></head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Erosion Sector 스테이지 에디터"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><strong>Erosion Sector</strong><span class="brand-divider"></span><span class="brand-sub">스테이지 에디터</span></a>
    <nav class="header-actions" aria-label="스테이지 작업">
      <span id="saveStatus" class="save-status" aria-live="polite" title="이 브라우저의 복원본입니다. .esfile 파일은 저장 버튼으로 내려받으세요.">불러오는 중</span>
      <details class="file-menu" id="fileMenu"><summary>파일</summary><div class="file-dropdown"><strong>스테이지 파일</strong><button data-action="new">새 스테이지 <kbd>새 작업</kbd></button><button data-action="open">.esfile 불러오기</button><button data-file-command="save">.esfile로 저장 <kbd>Ctrl S</kbd></button><hr><strong>타일 설계도</strong><button data-file-command="tile-folder">타일 폴더 연결</button><button data-action="import-nbt">NBT 파일 가져오기</button><hr><button data-action="sample">예시 스테이지 열기</button><button data-action="help">도움말</button></div></details>
      <button data-action="save" class="button primary" title="타일 배치·목표·이벤트를 .esfile 파일로 내려받습니다">스테이지 저장 <span>↓</span></button>
    </nav>
  </header>
  <div class="project-bar"><div class="project-heading"><span id="missionBadge" class="project-symbol">A1</span><div><button id="projectName" class="project-title" data-action="project" title="이름·작성자·챕터·난이도 편집"></button><div id="chapterCaption" class="project-caption">공간을 연결하고, 임무를 설계하세요.</div></div></div><div class="project-summary" id="projectSummary"></div><div id="checklist" class="checklist"></div><div class="workflow-next" title="제작 체크리스트"><span id="workflowCount"></span><span id="workflowNext">제작 체크리스트</span></div></div>
  <nav class="section-nav" aria-label="작업 메뉴"><button data-section="tiles">타일 배치</button><button data-section="events">이벤트 관리</button><button data-section="resources">자원 및 목표 배치</button><button data-section="variables">변수</button><button data-section="enemies">적</button><button data-section="goals">목표</button></nav>
  <main class="workspace">
    <aside class="library panel" id="libraryPanel" aria-label="타일과 기믹 라이브러리">
      <div class="panel-heading"><h2>라이브러리 </h2><div><button class="icon-button" data-action="import-nbt" aria-label="Create 설계도 가져오기" title="Create 설계도 가져오기">＋</button><button class="icon-button panel-close" data-action="close-library" aria-label="라이브러리 닫기">×</button></div></div>
      <div class="tabs" role="tablist" aria-label="라이브러리 분류"><button role="tab" aria-selected="true" data-tab="tiles">타일</button><button role="tab" aria-selected="false" data-tab="rooms">구역 트리</button></div>
      <div id="libraryContent" class="library-content"></div>

    </aside>
    <section class="editor" aria-label="스테이지 배치 작업 영역">
      <nav class="workspace-nav" aria-label="편집 작업"><div class="workspace-tabs"><button data-workspace="map" aria-current="page">배치 지도</button><button data-action="preview" data-workspace-tab="preview">타일 미리보기</button></div><div class="workspace-actions"><button data-action="toggle-library" class="icon-button mobile-toggle" title="라이브러리 열기" aria-label="라이브러리 열기">▤</button><button data-action="undo" class="icon-button" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button><button data-action="redo" class="icon-button" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button><button data-action="toggle-inspector" class="icon-button mobile-toggle" aria-label="속성 열기">☷</button></div></nav>
      <div class="editor-toolbar" aria-label="배치 지도 도구"><div class="tool-group"><button data-mode="select" class="tool active" title="선택 / 이동 (V)">↖ <span>선택</span></button></div><div class="view-switch" aria-label="보기 방식"><button data-view="plan" class="active">평면</button><button data-view="iso">입체</button></div></div>
      <div class="workspace-context" id="workspaceContext" hidden></div>
      <div id="managementPanel" class="management-panel" hidden></div><section id="logicPanel" class="logic-panel" aria-label="이벤트 작업실" hidden></section>
      <section id="tilePreviewPanel" class="tile-preview-panel" aria-label="설계도 미리보기 작업실" hidden></section>
      <div class="floor-bar"><span class="eyebrow">표시 층</span><div class="floor-controls"><button class="icon-button" data-action="floor-down" aria-label="아래 층">−</button><div id="floorTabs" class="floor-tabs"></div><button class="icon-button" data-action="floor-up" aria-label="위 층">＋</button></div><label class="ghost-toggle"><input type="checkbox" id="ghostToggle" checked> 다른 층 흐리게</label></div>
      <div class="canvas-wrap" id="canvasWrap"><canvas id="map" tabindex="0" aria-label="스테이지 배치도. 라이브러리의 타일을 지도에 끌어 놓아 배치합니다."></canvas><div class="empty-map" id="emptyMap" hidden><span class="empty-map-icon">▦</span><h2>배치된 타일 없음</h2><p id="emptyMapHint">Create에서 만든 타일 폴더를 연결하면<br>왼쪽 라이브러리에 설계도가 나타납니다.</p><button class="button primary" data-guide="tiles">타일 폴더 연결</button></div><div class="placement-banner" id="placementBanner" role="status" hidden><span id="placementHint"></span><button data-action="cancel-placement" title="배치 취소 (Esc)">취소 <kbd>Esc</kbd></button></div><div class="map-label"><span class="live-dot"></span><span id="viewLabel">1층 · 타일 배치도</span></div><div class="map-north"><span>N</span><div id="northArrow">↑</div></div><div class="iso-controls" id="isoControls" role="group" aria-label="입체 시점 조작" hidden><div><button data-action="camera-left" aria-label="시점 왼쪽 회전" title="시점 왼쪽 45도 회전">↶</button><button data-action="camera-reset" aria-label="시점 초기화" title="시점 초기화 및 전체 보기">⌂</button><button data-action="camera-right" aria-label="시점 오른쪽 회전" title="시점 오른쪽 45도 회전">↷</button></div><span id="cameraAngle">45° · 높이 30°</span></div><div id="cameraFallback" class="camera-fallback" hidden>간이 입체 보기 · 정확한 가림 처리는 WebGL이 필요합니다</div><div class="palette-drop-status" id="paletteDropStatus" role="status" hidden></div><div class="map-controls"><button data-action="zoom-out" aria-label="축소">−</button><span id="zoomLabel">100%</span><button data-action="zoom-in" aria-label="확대">＋</button><span class="control-divider"></span><button data-action="fit" title="전체 보기" aria-label="전체 보기">⌖</button></div><div class="map-legend"><span><i class="legend-port"></i> 연결된 문</span><span><i class="legend-open"></i> 미연결 문</span></div></div>
      <div class="validation-bar"><button data-action="validation" id="validationSummary" class="validation-summary"></button><span id="cursorStatus" class="cursor-status">X — · Z —</span></div>
    </section>
    <aside class="inspector panel" id="inspectorPanel" aria-label="선택 항목 속성"><div class="panel-heading"><h2>속성 </h2><div><span class="tiny-label" id="inspectorLabel">STAGE</span><button class="icon-button panel-close" data-action="close-inspector" aria-label="속성 닫기">×</button></div></div><div id="inspectorContent" class="inspector-content"></div></aside>
  </main>

  <input type="file" id="previewNbtInput" accept=".nbt" hidden>
  <dialog id="welcome" aria-labelledby="welcomeTitle"><div class="welcome-body"><h1 id="welcomeTitle">탐사할 시설을 설계하세요.</h1><div class="welcome-actions"><button class="button primary" data-action="welcome-new">＋ 새 스테이지 만들기</button><button class="button" data-action="welcome-open">기존 .esfile 불러오기</button><button id="resumeProject" class="button" data-action="welcome-resume" hidden>이 브라우저의 이전 작업 복원</button><button class="quiet" data-action="welcome-sample">공간 설계 예시 살펴보기 →</button></div></div></dialog>
  <input type="file" id="nbtInput" accept=".nbt" multiple hidden><input type="file" id="projectInput" accept=".esfile" hidden>
  <input type="file" id="tileFolderInput" webkitdirectory multiple hidden>
  <dialog id="dialog"><form id="dialogForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="닫기">×</button></div><div id="dialogBody" class="dialog-body"></div><div id="dialogActions" class="dialog-actions"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.mjs"></script>
</body></html>
